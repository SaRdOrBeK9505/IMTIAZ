# IMTIAZ — Nginx konfiguratsiyasi
# /etc/nginx/sites-available/imtiaz → symlink → /etc/nginx/sites-enabled/imtiaz

upstream imtiaz_app {
    # Gunicorn socket — TCP'dan tezroq
    server unix:/run/imtiaz/gunicorn.sock fail_timeout=0;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # SSL (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Security headers
    add_header X-Frame-Options          "DENY"            always;
    add_header X-Content-Type-Options   "nosniff"         always;
    add_header X-XSS-Protection         "1; mode=block"   always;
    add_header Referrer-Policy          "no-referrer"     always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Klient fayl yuklash limiti
    client_max_body_size 10M;

    # Statik fayllar — Nginx to'g'ridan-to'g'ri beradi (Gunicorn'ga tegmaydi)
    location /static/ {
        alias /home/imtiaz/app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /home/imtiaz/app/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # API va barcha boshqa so'rovlar → Gunicorn
    location / {
        proxy_pass         http://imtiaz_app;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;

        # Timeout sozlamalari (AI chat uzoq bo'lishi mumkin)
        proxy_connect_timeout  60s;
        proxy_send_timeout     120s;
        proxy_read_timeout     120s;

        # Buffer
        proxy_buffering    on;
        proxy_buffer_size  16k;
        proxy_buffers      8 16k;
    }

    # Gunicorn sog'ligini tekshirish
    location /health/ {
        proxy_pass http://imtiaz_app;
        access_log off;
    }

    # Nginx access log
    access_log /var/log/nginx/imtiaz_access.log combined buffer=64k flush=5s;
    error_log  /var/log/nginx/imtiaz_error.log  warn;
}
